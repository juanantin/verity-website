name: Verity X bot (manual)

# Scheduling now runs on Upstash QStash instead of GitHub Actions (see
# README.md), which polls as often as every 1-2 minutes rather than this
# workflow's 5-minute floor. This workflow is kept for manual/on-demand runs
# only — trigger it from the Actions tab when you want to test without
# waiting for the schedule.
on:
  workflow_dispatch: {}

jobs:
  reply-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Verity bot reply cycle
        run: |
          curl -sf -X POST "$VERITY_BOT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Length: 0"
        env:
          VERITY_BOT_URL: ${{ secrets.VERITY_BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
